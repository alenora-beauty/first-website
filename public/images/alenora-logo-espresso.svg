<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&amp;family=DM+Sans:wght@600;700&amp;display=swap');
      .brand-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-anchor: middle;
      }
      .brand-tagline {
        font-family: 'DM Sans', sans-serif;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-anchor: middle;
        font-size: 20px;
        text-transform: uppercase;
      }
    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A24B" />
      <stop offset="50%" stop-color="#F3E1B9" />
      <stop offset="100%" stop-color="#C9A24B" />
    </linearGradient>
  </defs>

  <!-- Background: Espresso #2A1A12 -->
  <rect width="1200" height="320" fill="#2A1A12" rx="16" />

  <!-- Main Wordmark: AL-ENORA (Complete with full R, A and hyphen, brightened warm gold) -->
  <text x="600" y="165" font-size="108" fill="url(#goldGradient)" class="brand-title">AL-ENORA</text>

  <!-- Horizontal Fine Accent Bar -->
  <line x1="160" y1="205" x2="1040" y2="205" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Tagline: ADORE YOUR DREAMS -->
  <text x="600" y="248" fill="#DEC077" class="brand-tagline">ADORE YOUR DREAMS</text>
</svg>

